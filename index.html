
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fake Canva Login Demo</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(120deg, #00c4cc, #7d2ae8);
  min-height: 100vh;
  display: grid;
  place-items: center;
}

.card {
  background: white;
  padding: 35px;
  border-radius: 16px;
  width: 340px;
  text-align: center;
  box-shadow: 0 10px 40px #3335;
}

.logo {
  font-size: 38px;
  font-weight: bold;
  color: #7d2ae8;
  margin-bottom: 10px;
}

input {
  width: 100%;
  padding: 13px;
  margin: 8px 0;
  border: 1px solid #ccc;
  border-radius: 8px;
}

button {
  width: 100%;
  padding: 13px;
  background: #7d2ae8;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
}

.warning {
  margin-top: 20px;
  background: #fff2cc;
  padding: 12px;
  border-radius: 8px;
  font-size: 13px;
  color: #654900;
}
</style>
</head>

<body>
<div class="card">
  <div class="logo">Canva Demo</div>
  <h2>Fake Login Demonstration</h2>
  <p>This is a cybersecurity learning experiment.</p>

  <form id="demo">
    <input type="email" placeholder="Example email" required>
    <input type="password" placeholder="Example password" required>
    <button type="submit">Try the demo</button>
  </form>

  <div id="result" class="warning">
    DEMO ONLY — Never enter real account details.
  </div>
</div>

<script>
document.getElementById("demo").addEventListener("submit", function(event) {
  event.preventDefault();

  this.reset();

  document.getElementById("result").innerHTML =
    "🚨 PHISHING AWARENESS! A fake login page can look convincing. Never enter your real password on an untrusted website.";
});
</script>
</body>
</html>
